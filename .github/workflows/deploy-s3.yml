name: Deploy to S3

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-s3
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync site to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::Repository variable S3_BUCKET is not set"
            exit 1
          fi
          aws s3 sync . "s3://$S3_BUCKET" \
            --delete \
            --exclude '.git/*' \
            --exclude '.github/*' \
            --exclude 'scss/*' \
            --exclude 'tests/*' \
            --exclude 'README.md' \
            --exclude '.gitignore'
